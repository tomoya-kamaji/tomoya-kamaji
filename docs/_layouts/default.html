<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="layout">
      <nav class="toc" aria-label="目次">
        <div id="toc-list" class="toc__list">
          {%- if page.toc == "resume" %}{% include resume-toc.html %}{% endif %}
        </div>
      </nav>

      <main class="main-content">
        <header class="page-header">
          <a class="page-header__name" href="{{ '/' | relative_url }}">{{ site.author }}</a>
          <h1>{{ page.title }}</h1>
          <p class="page-header__meta">最終更新 <time datetime="{{ site.time | date: '%Y-%m-%d' }}">{{ site.time | date: '%Y/%m/%d' }}</time></p>
        </header>

        {{ content }}
      </main>
    </div>

    <script src="{{ '/assets/js/toc.js' | relative_url }}"></script>
  </body>
</html>
