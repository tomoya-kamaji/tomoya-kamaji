# 職務経歴書（docs/index.md）の本文。値には HTML を書ける
# 見た目は docs/_layouts/resume.html、ルールは DESIGN.md を正とする

summary:
  lead:
    - エンジニア歴約 8 年。新卒で大手 SIer に入社し、基幹システムのリプレイスで要件定義からテスト・運用保守までを経験しました。
    - 設計書を書く側ではなく、自分の手でプロダクトを作る側に回りたいと考え、25 歳で東京のスタートアップへ転職しました。以降は Web 系エンジニアとして、バックエンドからフロントエンドまで一気通貫で担当しています。
    - 医療系 SaaS ではテックリードとして、5 名規模の開発チームの指針を整えました。チーム方針の決定、軽量な設計プロセスの導入、全実装のレビューを担いました。
    - 現在は 2 名体制のスタートアップ（株式会社 Matataki）で、B2B リードジェネレーション PF「SHOWDONE」の CPO を務めています。目標指標の設計から施策の決定、開発、導入支援までを担っています。

stack:
  id: skill-stack
  title: 技術スタック
  rows:
    - label: 言語
      value: TypeScript（5 年以上）、Go・Ruby（2〜3 年）、Python・Java（1〜2 年）
      strong: true
    - label: FW
      value: React（3〜5 年）、NestJS（3〜5 年）、Next.js、Express、Rails、Vue.js / Nuxt.js
    - label: インフラ
      value: AWS・Google Cloud・Terraform（各 2〜3 年）、AWS CDK、Docker
    - label: AI
      value: Cursor、Claude Code、Langfuse

ai:
  id: ai-usage
  title: 生成 AI の活用
  rows:
    - label: 開発
      value: 要件整理 → タスク分割 → TDD 実装 → 並列レビュー → PR 作成の流れを Skill にまとめ、チーム全員が同じ手順で AI を使えるようにした。
    - label: 組み込み
      value: エージェント用フレームワークは使わず、指示文・ツール・権限制御を自前で実装した。段階ごとに呼べるツールを絞り、検索前の提案や過剰な質問を防いでいる。
    - label: 品質
      value: Langfuse でトレース・トークン・コストを可視化し、評価用 CLI でモデルや構成を比較している。

experience:
  note: 新しい期間から順に記載。期間が重なる案件は下表で明示。
  items:
    - id: exp-showdone
      period: 2023/1〜現在
      name: 株式会社 Matataki
      role: CPO
      type: 業務委託
      detail: /jobs/matataki/matataki-showdone.html
      rows:
        - label: プロダクト概要
          value: 「決裁者にアプローチしたい営業・事業責任者様」と「課題解決の提案を受けたい決裁者様」を繋げる B2B リードジェネレーションプラットフォーム「SHOWDONE」を開発（<a href="https://showdone.jp">https://showdone.jp</a>）
        - label: 形態
          value: 業務委託（2026/2 からフルタイム）
        - label: 体制
          value: 代表（営業）1 名 + 自分（プロダクト専任）+ 業務委託
        - label: 技術
          value: TypeScript、Next.js、NestJS、Prisma、PlanetScale、AWS、AWS CDK、Langfuse、PostHog
      duties:
        - category: プロダクトマネジメント・事業推進
          items:
            - NSM（北極星指標）およびサブ指標の策定、SQL・PostHog によるダッシュボード構築
            - プロダクトバックログの管理、優先順位付け、仕様策定
            - 仮説検証とデータに基づく機能の継続・撤退判断
        - category: フロントエンド・バックエンド・インフラ開発（Next.js × NestJS）
          items:
            - フロントエンド（Next.js）・バックエンド（NestJS）のアーキテクチャ設計・標準化
            - テーブル設計（Prisma / PlanetScale）、API 設計、実装
            - Zod × OpenAPI によるスキーマ駆動開発の導入・運用
            - モノレポ化、表示速度のパフォーマンス・チューニング、AWS コスト最適化
            - 要件整理から TDD 実装・並列レビュー・PR 作成までの AI 開発ワークフロー（Skill）構築
        - category: AI 機能の設計・実装・品質管理
          items:
            - 外部フレームワークに依存しない自前 AI エージェント基盤の設計・実装
            - URL からのサービス自動登録、オファー文面添削・下書き生成、対話型商材探索の実装
            - Langfuse を用いたトレース・トークン・コストの可視化と評価 CLI の構築
        - category: 開発以外の業務
          items:
            - 業務委託エンジニア向けのタスク切り出し（1 PR 単位の縦割り定義）と完了条件の策定
            - 顧客インタビューの実施と週次でのプロダクト還元
            - 交流会・カンファレンスでの営業
      values:
        - title: NSM（北極星指標）と 8 つのサブ指標の策定による判断基準の構築とファネル改善
          sections:
            - heading: 背景
              paragraphs:
                - 参画当初、施策や実装の優先順位を決めるチーム共通の基準がなく、どの施策に注力すべきか判断しづらい状態だった。
                - また、プロダクト専任が自分 1 名という限られたリソースの中で、売上・事業成長に直結する施策へ集中する必要があった。
            - heading: 発揮したバリュー
              paragraphs:
                - 施策や実装に入る前に、プロダクトの存在意義・ペルソナ・価値交換の仕組みを言語化し、CEO と合意して判断の土台を作った。
            - heading: 指標設計とボトルネックの特定
              paragraphs:
                - NSM（目標指標）を<strong>「月間有効商談数」</strong>に定め、その配下に 8 つのサブ指標を置いて SQL と PostHog で定義・ダッシュボード化した。
        - title: フロントエンド（Next.js）・バックエンド（NestJS）のアーキテクチャ標準化と AI 駆動開発の仕組み化
          sections:
            - heading: 背景
              paragraphs:
                - 旧構成と新構成のコードが混在しており、新規実装で従うべきアーキテクチャが定まっていなかった。
                - また、少人数（フルタイム 1 名 + 業務委託）で高速に機能開発を進めるため、迷いなく実装・レビューできる規約とタスク分割の仕組みが必要だった。
            - heading: 発揮したバリュー
              paragraphs:
                - フロントエンドとバックエンドの標準構成を策定し、AI エージェントや業務委託メンバーも同じ手順で開発できるよう Skill とルールに落とし込んだ。
            - heading: バックエンド（NestJS）の設計で意識した点
              paragraphs:
                - Domain・UseCase・Infra のレイヤーに分け、複雑なロジックは純粋関数で表現する方針を立てた。
                - 最初からすべてを重厚なドメインモデルにはせず、複雑さに応じて純粋関数や判別共用体（Discriminated Union）へ引き上げる基準を設け、過剰設計を防ぎつつドメイン知識を保護できるようにした。
            - heading: フロントエンド（Next.js）の設計で意識した点
              paragraphs:
                - サーバー状態（TanStack Query）・画面固有の状態（React Context）・UI の 3 層構成を新規実装の標準にした。
                - ローディングは Suspense、エラーは ErrorBoundary に委譲することで、各画面コンポーネント内の条件分岐を減らし見通しを良くした。
            - heading: タスク分解と開発ワークフローの標準化
              paragraphs:
                - Notion の Task に完了条件を明記し、1 PR でリリースできる縦割りの単位に分割する運用を整えた。
                - さらに、要件整理→タスク分割→TDD 実装→並列レビュー→PR 作成までの一連の流れを Skill にまとめ、人間の判断が必要なタスクと AI・業務委託に任せられるタスクを切り分けて高速に開発を回せるようにした。
        - title: AI エージェント基盤の構築と Langfuse による観測・評価運用
          sections:
            - heading: 背景
              paragraphs:
                - サービス登録やオファー文面の作成、商材探索など、ユーザーの入力・運用コストが高い工程がボトルネックになっていた。
                - 一方で、LLM を組み込む際には検索前の推測による誤提案や過剰な質問、トークンコストの増加を防ぐ必要があった。
            - heading: 発揮したバリュー
              paragraphs:
                - ユーザーの手間を削減する複数の AI 機能を設計・実装し、本番で使える品質とコスト管理の基盤を整えた。
            - heading: 具体的な実装
              items:
                - URL を入力するだけでサービスページを自動生成する機能
                - 相手に合わせてオファー文面を添削・下書き生成する機能
                - 対話形式で課題を整理し商材を探索するエージェント機能
            - heading: 意識した点、工夫した点
              paragraphs:
                - ブラックボックス化しやすい外部のエージェント用フレームワークはあえて使わず、指示文・ツール・権限制御を自前で実装した。
                - 特に段階的な対話が必要な商材探索では、フェーズごとに呼び出せるツールを厳密に制限することで、検索前の早まった提案やユーザーへの過剰な質問を防いだ。
            - heading: 結果
              paragraphs:
                - Langfuse を導入してトレース・トークン消費量・コストを常時可視化し、評価用 CLI でモデルやプロンプト構成を比較できるようにした。
                - オファー下書き生成は社内でも<strong>「そのまま使える」</strong>と評価される精度になり、ユーザーの登録・送信時の運用負荷を大幅に下げることができた。
        - title: パフォーマンス・チューニングとモノレポ・インフラ基盤の改善
          sections:
            - heading: 背景
              paragraphs:
                - 機能拡張に伴い、画面の表示速度低下や AWS・LLM 呼び出しのコスト増加が課題になっていた。
                - また、リポジトリが分かれていたことでフロントエンドとバックエンドを跨ぐ変更に手間がかかっていた。
            - heading: 発揮したバリュー
              paragraphs:
                - 新機能開発と並行して、開発体験と本番環境のパフォーマンス・コスト改善を一貫して行った。
            - heading: 具体的な取り組みと結果
              items:
                - 散在していたリポジトリをモノレポに統合し、Zod / OpenAPI による型連携と横断的な変更をスムーズにした
                - TTFB（Time to First Byte）、認証処理、DB クエリの並列化を見直し、画面の表示速度を改善した
                - AWS 構成の整理と LLM 呼び出しの最適化を行い、インフラおよび API の運用コストを削減した
    - id: exp-medical
      period: 2024/3〜2026/2
      name: 医療系 SaaS
      role: テックリード
      type: 業務委託 → 正社員
      detail: /jobs/con/overview.html
      rows:
        - label: プロダクト概要
          value: 「医療機関様」と「患者様」を繋ぎ、電子同意書や医療向け説明動画の配信、入退院プロセスの支援を行う医患連携 SaaS を開発
        - label: 形態
          value: 正社員（2024/10〜）。2024/3〜2024/9 は業務委託
        - label: 体制
          value: EM 1 名、PdM 1 名、テックリード 1 名（自分）、エンジニア 3 名、デザイナー 1 名
        - label: 技術
          value: TypeScript、Nuxt.js、Express、Google Cloud、MySQL、Cloud Logging、Sentry
      duties:
        - category: テックリード・開発プロセス改善
          items:
            - 機能開発におけるアーキテクチャ・仕様の設計支援およびコードレビュー
            - 軽量な設計プロセス（API 仕様・データモデル定義）と PR 運用ルールの策定・定着
            - 開発メンバーとの 1on1 の実施とチーム全体の品質向上
        - category: 機能開発・セキュリティ・運用基盤強化（Nuxt.js × Express × Google Cloud）
          items:
            - 電子同意書と電子カルテを繋ぐ連携 API のセキュリティ設計・実装（API キー + クライアント証明書の多層防御）
            - 医療向け説明動画配信機能の再設計と基盤刷新のリード
            - 入退院プロセス支援機能群の設計リード・実装
            - LINE 連携を含むユーザー中心のアカウント設計の推進
            - オブザーバビリティ強化（Cloud Logging、Sentry、トレーシング、Slack アラート整備）
        - category: 開発以外の業務
          items:
            - 医療機関・電子カルテベンダーとの仕様折衝、認証局選定および証明書発行プロセスの調整
            - 医療機関での連携導入における現地立会い・導入支援
            - ビジネスサイドの商談への同席と、システム観点からの技術提案
      values:
        - title: 軽量な設計プロセスとレビュー基準の導入による手戻り削減・リリース安定化
          sections:
            - heading: 背景
              paragraphs:
                - 参画当初、明確な設計フェーズがなく、要件や仕様の認識差が実装段階になってから顕在化していた。
                - また、1 つの PR あたりの変更規模が大きく、レビュー負荷の高さや不具合の混入、リリース後の改修再発に時間が取られていた。
            - heading: 発揮したバリュー
              paragraphs:
                - 重い設計工程を入れても形骸化すると考え、チームが無理なく続けられる「最小限の設計ドキュメント + レビュー観点の固定 + PR の粒度基準」の 3 点に絞って仕組み化した。
            - heading: 設計と PR 運用について意識した点
              items:
                - 設計ドキュメントの最小化：事前に作るドキュメントを「API 仕様」と「データモデル」の 2 つだけに絞った
                - 設計レビューの定例化と観点固定：「影響範囲」と「代替案」をレビューテンプレートに組み込み、承認基準を明確にした
                - PR 運用の再設計：小さく早くマージする変更粒度の基準と、未レビューのコードはマージしないルールを徹底した
                - ナレッジの一元化と定着：設計・決定事項・振り返りを Notion に集約し、月次の振り返りで運用を見直してチームに定着させた
            - heading: 結果
              paragraphs:
                - 実装前の事前合意によって仕様の不整合を早期に吸収できるようになり、要件起因の手戻りとリリース後の改修再発が大幅に減った。
                - また、PR あたりの変更ファイル数が縮小してレビュー時間が短縮され、設計からリリースまでのリードタイムが安定した。
        - title: 電子同意書と電子カルテを繋ぐ連携 API のセキュリティ設計・実装
          sections:
            - heading: 背景
              paragraphs:
                - 電子カルテ連携にあたり、セキュリティ要件が非常に厳しい医療機関への導入障壁をクリアする必要があった。
                - 以降の医療機関への導入でも再利用できる標準手順と実装テンプレートを確立することが求められていた。
            - heading: 発揮したバリュー
              paragraphs:
                - セキュリティ設計から実装、ベンダー折衝、現地での導入立会い、運用フローの整備までを主導した。
                - インフラ制約で一般的な相互認証が使えない中、アプリケーション層での証明書検証と API キーによる多層防御を設計した。
            - heading: 具体的な取り組み
              items:
                - 認証局の比較・選定と、電子カルテベンダーとの要件定義・仕様のすり合わせを
                - 鍵・証明書のローテーションを前提とした認証方式を設計・実装した
                - 検証失敗を追跡できる監査ログと例外ハンドリングを標準化した
            - heading: 結果
              paragraphs:
                - 本番運用開始から 1 年間、セキュリティや連携に関するインシデント 0を継続した。
                - 医療機関での導入を現地立会いで成功させ、以降の医療機関向け連携の標準テンプレートとなった。
        - title: 説明動画配信基盤の刷新とオブザーバビリティ（監視・アラート）の強化
          sections:
            - heading: 背景
              paragraphs:
                - 医療現場で使われる説明動画配信機能の再設計にあたり、期日内の確実なリリースと、障害発生時に即座に原因を特定できる運用基盤の強化が課題となっていた。
            - heading: 発揮したバリュー
              paragraphs:
                - 機能設計のリードだけでなく、設計段階から「運用時の検知性」を織り込むことで、サービスの安定稼働に貢献した。
            - heading: 意識した点、具体的な取り組み
              items:
                - 医療向け説明動画配信機能の再設計と基盤刷新をリードし、関係者と調整しながら期日内にリリースを完遂した
                - 障害が起きた際にすぐ気づき、原因調査ができるよう、Cloud Logging・Sentry・Slack を用いたログ構造化、トレーシング、アラート通知を整備した
                - 設計レビューの段階から監視・ログ出力の観点を組み込み、チーム全体で運用を意識した実装ができるように底上げした
    - id: exp-ads
      period: 2023/1〜2023/12
      name: 検索連動型広告
      role: 配信サーバ モジュールオーナー
      type: 正社員
      rows:
        - label: プロダクト概要
          value: 収益の柱である検索連動型広告の配信サーバ（<strong>秒間 6,000 リクエスト</strong>）を開発・運用
        - label: 形態
          value: 正社員
        - label: 体制
          value: CTO 1 名、SWE 5 名、DS 5 名、SRE 2 名
        - label: 技術
          value: Go、Python、Vue.js、Google Cloud（GKE、BigQuery、Cloud Monitoring）、Terraform、MySQL、Redis
      duties:
        - category: 広告配信サーバ（Go / GKE）のモジュールオーナー・運用改善
          items:
            - コアロジックの単体テスト・CI 整備とコードレビュー
            - Cloud Logging・Cloud Monitoring を用いた監視・Slack アラート基盤の構築
            - Redis とメモリキャッシュの 2 層構成によるパフォーマンス改善
        - category: 広告収益（KPI）改善・マイクロサービス開発
          items:
            - 配信ログの分析に基づく A/B テスト施策の立案・実装・SQL 効果検証
            - 形態素解析器 Sudachi を共通利用するための gRPC サーバ（Python / GKE / Terraform）の設計・構築
      values:
        - title: 広告配信基盤のテスト・監視整備と収益損失の防止
          sections:
            - heading: 背景
              paragraphs:
                - 前任オーナーの退職に伴い、秒間 6,000 リクエストを処理する広告配信サーバを引き継いだ。
                - 収益の柱でありながらテストと監視が手薄で、特定メディアでの広告在庫不足や、起動時の予測モデル読み込み失敗（放置すると収益減に直結する）に誰も気づけない状態だった。
            - heading: 発揮したバリュー
              paragraphs:
                - テスト・監視・性能の 3 軸で配信基盤を立て直した。
              items:
                - コアロジックの単体テストと CI：API レベルの統合テストは保守コストに対して恩恵が小さいと判断し、配信のコアロジックに絞って単体テストと CI を整備し、仕様書としても機能するようにした
                - 広告不足とモデル読み込み失敗の検知：Cloud Logging のログベース指標と Cloud Monitoring で Slack 通知を構築し、Goroutine で動いていたモデル読み込みのエラーハンドリングとタイムアウトも見直した
                - 性能改善：Redis とメモリキャッシュの 2 層構成にし、高トラフィック下の配信負荷を下げた
            - heading: 結果
              paragraphs:
                - 取りこぼしていた配信枠を即座に検知できるようになり<strong>月約 20 万 imp を回復</strong>、モデル読み込み失敗を早期に検知して<strong>収益減を未然に防止</strong>した。
        - title: 収益改善に向けた A/B テストの高速検証
          sections:
            - heading: 背景
              paragraphs:
                - 配信ログを分析する中で、収益性が高そうなのに表示されない広告があることに気づき、新規入稿された広告ほど表示優先度が低く抑えられるコールドスタート問題が原因だと特定した。
            - heading: 発揮したバリュー
              paragraphs:
                - 施策の議論に時間をかけすぎず、撤退しやすいよう設定用テーブルは作らず最小工数で最短リリースし、本番の数字で判断する方針をとった（本採用時に残るコア処理は負債にならないよう設計）。
                - ビジネスチームと施策を立て、実装から A/B テスト配信、BigQuery（SQL）での効果検証までを 1 人で一貫して回し、広告収益の改善につなげた。
        - title: 形態素解析器 Sudachi を共通利用する gRPC サーバの構築
          sections:
            - heading: 背景と技術選定
              paragraphs:
                - 複数のマイクロサービスで形態素解析の処理が重複していたため、共通サーバとして切り出すことになった。
                - 標準言語の Go には保守されたライブラリがなかったため、Python と Java の性能を比較検証し、性能差がなくシンプルに書ける Python を採用した。
            - heading: 結果と学び
              paragraphs:
                - Python・Docker・Terraform・GKE をキャッチアップし、約 3 週間で構築して本番投入した。一方で、利用者に gRPCが慣れていないエンジニアも含まれていたため、スキーマ共有の手間を考えると gRPC よりシンプルな REST API で問題なかったと感じた。
    - id: exp-matching
      period: 2021/6〜2022/12
      name: 複業マッチング
      role: 専任サーバサイド
      type: 正社員
      detail: /jobs/another/overview.html
      rows:
        - label: プロダクト概要
          value: 「複業したいユーザ様」と「複業人材を採用したい企業様」を繋げるマッチングプラットフォームを開発（<a href="https://talent.aw-anotherworks.com">https://talent.aw-anotherworks.com</a>）
        - label: 形態
          value: 正社員
        - label: 体制
          value: CTO 1 名、CDO 1 名、PdM 1 名、フロントエンド 2 名、サーバサイド 1 名（自分）、デザイナー 1 名
        - label: 技術
          value: TypeScript、Node.js、Express、TypeORM、Ruby on Rails、Next.js、AWS、MySQL、Elasticsearch
      duties:
        - category: Node.js(TypeScript)×DDD×オニオンアーキテクチャでのリプレイス
          items:
            - ドメインモデル図の作成
            - テーブル設計、API 設計、実装
            - Jest によるテスト実装
            - バッチ処理の実装
            - Sentry など各種ミドルウェアのインストール
            - OpenAPI の導入、運用
            - gRPC を用いた AI サーバとのつなぎこみ
        - category: 新規機能の開発、保守改修(Rails)
          items:
            - テーブル設計、API 設計、実装
            - RSpec によるテスト実装
            - バッチ処理の実装
            - 機械学習用の CSV データ作成
        - category: 開発以外の業務
          items:
            - BigQuery を用いて分析用のデータ出し
            - タスクの切り出しを行い、業務委託人材へのタスクの準備
            - 他部門のフィードバック 1 次対応
      values:
        - title: Rails から Node.js(TypeScript) への DDD の思想を取り入れたリプレイス
          sections:
            - heading: 背景
              paragraphs:
                - 当初、サーバサイド言語として Rails を使用していたが下記 2 点の理由から保守することに工数がかかっていた。
                - 上記理由から、Node.js(TypeScript) へのリプレイスを CTO 主導のもと 2 人で進め、<strong>約 1 年で約 120 エンドポイント</strong>を移行した。
              items:
                - 業務委託人材が入れ替わりで対応していたため、コードに統一感がなく複雑になっている
                - Rails は型がなく動作させるまで処理が追いづらく保守に工数がかかる
            - heading: 発揮したバリュー
              paragraphs:
                - 初めての言語（TypeScript）、初めての設計手法（DDD）であり、かなり苦労したが TypeScript に関しては公式ドキュメント、DDD に関しては「ドメイン駆動設計（モデリング / 実装ガイド）」等の書籍で概念を短期間でキャッチアップして戦力として貢献した。
            - heading: 設計について意識した点
              paragraphs:
                - 必ず依存の向きが逆転しないように意識して、「Presenter 層は Usecase 層のみ依存できる、Usecase 層は Infra 層の interface に依存できる。Infra 層の実態には依存できない」を指針に実装を行った。
                - 依存のルールを明確にすることで、各層での役割が明確になり迷いなく実装できるようになった。
            - heading: 更新系と取得系の処理について
              paragraphs:
                - ドメイン層を用いて実装を行っていく中で、複数集約を跨いで値を取得することもあったため取得系の処理が肥大化してしまうことがあった。
                - そこで、更新・作成系の処理はドメインモデルを経由して DB（infra 層）にアクセス、取得系の処理は別途取得用のモデル（CQRS）を定義して DB にアクセスするように実装した。
                - 更新や作成はドメインルールを逸脱するとデータ不整合が起こる可能性があるが、取得の際にはデータ不整合は起こらない。また、一覧系の API などは取得するテーブルが肥大化してしまい、ドメインモデルを経由するのが困難なためこの判断をした。取得系と更新系でモデルを分けることでそれぞれに適したクエリの発行ができるようになった。
            - heading: クリーンアーキテクチャについて書いた技術記事
              items:
                - <a href="https://speakerdeck.com/tomoyakamaji/menherakodowodiwoshi-tutequ-zhu-suru">Speaker Deck：メンヘラコードをDDDを使って駆逐する</a>
                - <a href="https://speakerdeck.com/tomoyakamaji/clean-architecture-da-ren-nixue-busohutoueagou-zao-toshe-ji">Speaker Deck：Clean Architecture 達人に学ぶソフトウェアの構造と設計</a>
        - title: ユーザ検索機能：リプレイス、全文検索エンジンの実装、パフォーマンス・チューニング
          sections:
            - heading: 背景
              paragraphs:
                - 企業側のメイン機能であるユーザ検索機能のリプレイスに伴い全文検索エンジンの実装、パフォーマンス・チューニングを行った。
              items:
                - 全文検索の課題：RDB、Like 句の前方後方一致での検索ノイズが多かったため改修が必要だった
                - パフォーマンスの課題：検索条件複雑化に伴いテーブルの join が肥大化し、コードが複雑になり改修がしづらくなっていた
            - heading: 発揮したバリュー
              paragraphs:
                - 上記課題を解決するため、検索部分に Elasticsearch を使用する方針を決定して、setting、mapping の作成から検索機能の実装まで一通り行った。
            - heading: 具体的な実装
              items:
                - Elasticsearch の analyzer、index の定義（analyzer は Ngram と Kuromoji を使用）
                - MySQL から Elasticsearch のドキュメントへのデータの流し込み（バッチ処理の実装）
                - 検索 API 実装：検索クエリの作成
            - heading: 意識した点、苦労した点
              paragraphs:
                - 「検索ノイズが少なく、検索漏れも少ない全文検索エンジン」の構築に苦労したが、最終的に Ngram と Kuromoji を併用する方法で実装を行った。
                - Ngram はノイズが多いが、検索漏れが少ないので必須の検索条件（query の must 句）に定義する。Kuromoji は検索漏れは多いが、ノイズが少ないので任意の検索条件（query の should 句）に定義する。両者を検索条件に含めることで、検索ワードの類似度が高い（_score が高い）ものが上位に表示されるようになった。
            - heading: 結果
              paragraphs:
                - その結果 <strong>2.0s かかっていた検索処理を 0.5s まで改善</strong>することができた。また、検索時の実装がシンプルになりコードの可読性も高くなった。
            - heading: 当時、書いた技術記事
              items:
                - <a href="https://speakerdeck.com/tomoyakamaji/fu-za-najian-suo-chu-li-woelasticsearchdequ-zhu-suru">Speaker Deck：複雑な検索処理をElasticsearchで駆逐する</a>
        - title: 障害対応、Sentry 対応
          sections:
            - heading: 背景
              paragraphs:
                - サーバサイド専任がほぼ 1 人なのでサーバサイドに関与する障害や Sentry 通知はほぼすべて対応した。
            - heading: 通知が来たらまず 1 次対応すること
              paragraphs:
                - バグが起こったことをすぐに検知する仕組みとして Sentry を Slack に通知しており、通知が増えると放置しがちなので、通知がきたそのときに 1 次対応することを意識した。
                - 1 次対応して、すぐに対応する必要があれば hotfix で対応し、1 時間ほどで修正できそうであればすぐに対応、そうでなければ技術的課題としてタスク化した。
            - heading: ログを吐いて、デバッグがしやすいように
              paragraphs:
                - Sentry が来たときなどサーバログから原因調査しやすいように、特に定期バッチなど処理が追いづらいものは多めにログを吐くようにした。
        - title: OpenAPI(Stoplight) の導入
          sections:
            - heading: 背景
              paragraphs:
                - 元々フロントとの API 連携を Notion や Jira などのドキュメントツールで行っており、フォーマットがバラバラなことが起因してコミュニケーションコストが発生していた。また、開発チームが大きくなったことを考えて、API 仕様をドキュメントとして残していきたいと考えた。
            - heading: 発揮したバリュー
              paragraphs:
                - API ドキュメント化する手法を調査し、<a href="https://stoplight.io/studio/">Stoplight Studio</a> を使用しての OpenAPI 作成を提案し導入〜運用まで行った。半年間ほど運用していく中で、フロントメンバーにも好評でコミュニケーションコストが下がった。
    - id: exp-tekisei
      period: 2022/1〜2022/6
      name: 適性検査
      role: API 設計・実装
      type: 業務委託
      rows:
        - label: プロダクト概要
          value: 新卒向けの適性検査サービスにおいて、相性診断 API の設計・実装・テストを担当
        - label: 形態
          value: 業務委託（月 40〜50 時間）
        - label: 体制
          value: ベトナムのメンバーと協業
        - label: 技術
          value: TypeScript、NestJS
      values:
        - title: 短時間稼働・オフショア協業でのリードタイム短縮
          sections:
            - heading: 背景と発揮したバリュー
              paragraphs:
                - 月 40〜50 時間という限られた稼働時間では、一度バグが出ると修正対応でリリースまでのリードタイムが大きく延びる課題があり、またベトナムのメンバーとの協業で口頭だけでは仕様の認識ずれが起きやすかった。
                - そこで単体・結合テストを厚く書いてリリース前の手戻りを防ぎ、仕様はすべて英語のドキュメントに残して認識をそろえる運用を徹底し、リリースのリードタイムを短縮した。
    - id: exp-sier
      period: 2018/4〜2021/5
      name: 大手 SIer
      role: 基幹システム開発
      type: 正社員
      rows:
        - label: プロダクト概要
          value: 大手企業の基幹システム開発において、要望のヒアリングから要件定義、設計、実装、テストまでを一貫して担当
        - label: 形態
          value: 正社員
        - label: 技術
          value: Java、Oracle、Python
      values:
        - title: Python によるログ解析・整形ツールの開発と部署横断展開
          sections:
            - heading: 背景と発揮したバリュー
              paragraphs:
                - テスト工程のログが非構造で手作業で確認しており、エラー箇所の特定に 1 件 30 分以上かかることもあった。
                - Python でログの解析・整形ツールを開発してエラーパターンを自動検出し、特定時間を<strong>平均 70% 削減</strong>。チーム 7 名に展開し、他チームからも引き合いがあり部署横断で利用された。
        - title: チームへの Notion 導入とオンボーディング期間の短縮
          sections:
            - heading: 背景と発揮したバリュー
              paragraphs:
                - Excel や Word にドキュメントが散らばり情報が見つからず、新メンバーのオンボーディングに時間がかかっていた。
                - 導入提案のプレゼンだけでなく、テンプレートとドキュメント構造の設計、勉強会の開催まで主導し、<strong>新メンバーのオンボーディング期間を 2 週間短縮</strong>した。

pr:
  - id: pr-curiosity
    title: 難しい要件ほど燃える知的好奇心
    body: 未経験だった TypeScript × DDD での約 120 エンドポイント移行や、インフラ制約で一般的な相互認証が使えない中での電子カルテ連携 API のセキュリティ設計など、前例のない複雑な課題ほど楽しみながら主体的にキャッチアップして突破口を見つけてきた。
  - id: pr-plan
    title: ゴールから逆算する計画性とタスク分解
    body: 期日や事業目標から逆算し、不確実な要件でも 1 PR で出せる縦割りの単位に分解して見通しを作る。株式会社 Matataki では NSM（月間有効商談数）と 8 つの指標で優先度を絞り、医療系 SaaS では実装前の最小限の設計合意で手戻りを防いだ。
  - id: pr-finish
    title: 言ったことをやり抜き、チームに伝搬させる責任感
    body: 本番を止めずに約 1 年かけたシステム移行や、期日のある動画配信基盤の刷新を完遂した。自身がまずコミットしたことを最後までやり切る姿勢を見せることで、チーム全体に「決めたことをやり遂げる文化」を作ってきた。
  - id: pr-respect
    title: 周囲へのリスペクトと配慮ある協業
    body: エンジニアだけでなく PdM・デザイナー・営業など他職種にも敬意を持って接する。レビューや仕様議論では相手の背景を汲み取り、代替案と判断理由を言葉にして伝える。また、自分がチームのボトルネックになっているときは自身の実装よりレビューや相談対応を最優先する。
  - id: pr-condition
    title: 体調管理を土台にした一定のパフォーマンス
    body: 安定したアウトプットを出し続けるため、食事・睡眠・運動のコンディション管理を徹底している。トラブル発生時や繁忙期でも気分の浮き沈みを作らず、常に冷静かつ一定のペースで開発や障害対応に向き合える。

