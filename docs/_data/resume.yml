# 職務経歴書（docs/index.md）の本文。値には HTML を書ける
# 見た目は docs/_layouts/resume.html、ルールは DESIGN.md を正とする

summary:
  rows:
    - label: 役割
      value: <strong>株式会社 Matataki の CPO</strong>（フルタイム）。プロダクト専任は自分 1 名
    - label: 強み
      value: <strong>企画から改善まで一気通貫</strong>。基盤コードの立ち上げも品質を保って速く進められる
    - label: 志向
      value: <strong>事業成長に寄与する役割</strong>を担いつつ、コードも書き続けたい
  note: 顧客理解を起点に「何を作るか」と「どう実現するか」をつなぎ、企画・要件定義・設計・デリバリー・改善までを担当する。

skills:
  - id: skill-product
    title: プロダクト企画・開発推進
    lead: 施策決定からリリース後改善まで推進できる。
    body: 事業方針を踏まえて施策を決め、要件定義に落とす。
    link: { href: "#exp-showdone", label: SHOWDONE での取り組み }
  - id: skill-app
    title: アプリケーション開発・設計
    lead: 高負荷サービスの設計・実装ができる。
    body: 秒間 6,000 リクエストの広告配信で、Redis とメモリキャッシュの 2 層構成により負荷を削減。
    link: { href: "#exp-ads", label: 広告配信の詳細 }
  - id: skill-process
    title: 開発プロセス・チーム標準化
    lead: チームに適度な規律を入れ、デリバリーを速くできる。
    body: Design Docs、レビュー、Cursor ルールを導入。
    link: { href: "#exp-medical", label: 医療 SaaS でのプロセス改善 }

stack:
  id: skill-stack
  title: 技術スタック
  rows:
    - label: 得意
      value: TypeScript（5 年）、Express / Nest.js / Next.js、AWS / Google Cloud、Docker
      strong: true
    - label: その他
      value: Golang、Ruby on Rails、Vue.js / Nuxt.js、Terraform、AWS CDK

